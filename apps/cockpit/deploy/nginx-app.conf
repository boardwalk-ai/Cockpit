# Cockpit Flutter web — static app at app.octopilothub.com
#
# Install on the server (187.124.92.119):
#   sudo cp apps/cockpit/deploy/nginx-app.conf /etc/nginx/sites-available/cockpit-app
#   sudo ln -sf /etc/nginx/sites-available/cockpit-app /etc/nginx/sites-enabled/cockpit-app
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.octopilothub.com -d studystudio.octopilothub.com
#
# Files are served from /var/www/cockpit (published by Deploy-Web.ps1).
# DNS: studystudio.octopilothub.com  A  187.124.92.119
# (app.octopilothub.com was retired — studystudio is the only host.)

server {
    listen 80;
    listen [::]:80;
    server_name studystudio.octopilothub.com;

    root /var/www/cockpit;
    index index.html;

    # Gzip JS/CSS/JSON (Flutter main.dart.js is large).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Entry points + SW: never HTTP-cache. Deploy stamps a new SW / build id
    # each release; browsers must revalidate on every visit.
    location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Deferred parts / source maps — same rule (names vary by build).
    location ~* \.(part\.js|js\.map)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Fingerprinted / rarely changing static assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    location /canvaskit/ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    location /icons/ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # SPA: unknown paths fall through to index.html (GoRouter deep links).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
