# Local dependencies for octonotes-api (for machines with Docker; the native
# Postgres 17 works too for Phase 0). Everything binds to loopback only.
#   docker compose -f docker-compose.dev.yml up -d
services:
  octonotes-db:
    image: pgvector/pgvector:pg17
    container_name: octonotes-db
    environment:
      POSTGRES_DB: octonotes
      POSTGRES_USER: octonotes
      POSTGRES_PASSWORD: octonotes
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - octonotes-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octonotes -d octonotes"]
      interval: 5s
      retries: 10

  # Live fan-out + job wake-ups (from Phase 2).
  octonotes-redis:
    image: redis:7-alpine
    container_name: octonotes-redis
    ports:
      - "127.0.0.1:6380:6379"

  # S3-compatible object store for audio, materials, exports. MinIO's images
  # are no longer on Docker Hub, so dev uses RustFS (same S3 API); production
  # keeps the server's existing MinIO.
  octonotes-s3:
    image: rustfs/rustfs:latest
    container_name: octonotes-s3
    environment:
      RUSTFS_ACCESS_KEY: octonotes
      RUSTFS_SECRET_KEY: octonotes-dev-secret
    ports:
      - "127.0.0.1:9010:9000"
    volumes:
      - octonotes-minio:/data

volumes:
  octonotes-pg:
  octonotes-minio:
