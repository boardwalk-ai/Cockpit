# Production data store for OctoNotes: notes_db (Postgres 17 + pgvector),
# loopback only. Redis and MinIO are the existing Study Studio containers
# (cockpit-redis, cockpit-minio) — point REDIS_URL / S3_* at them.
#   docker compose -f docker-compose.prod.yml --env-file /opt/octonotes-api/db.env up -d
services:
  octonotes-db:
    image: pgvector/pgvector:pg17
    container_name: octonotes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: octonotes
      POSTGRES_USER: octonotes_admin
      POSTGRES_PASSWORD: ${OCTONOTES_DB_ADMIN_PASSWORD:?set in db.env}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100"]
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - octonotes-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octonotes_admin -d octonotes"]
      interval: 10s
      retries: 10

volumes:
  octonotes-pg:
