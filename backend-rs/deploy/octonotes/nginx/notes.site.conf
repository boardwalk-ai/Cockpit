# notes.octopilothub.com — OctoNotes (Flutter web) + OctoNotes API
server {
    listen 80;
    listen [::]:80;
    server_name notes.octopilothub.com;
    root /var/www/octonotes-web;
    index index.html;

    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|version\.json|manifest\.json|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~ ^/(assets|canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    include /opt/octonotes-api/src/deploy/octonotes/nginx/octonotes.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
