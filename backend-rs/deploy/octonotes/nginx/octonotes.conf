# OctoNotes API — include inside the chosen site's `server { … }` block (the
# hosting domain is decided together with The Deck). Public base becomes
# https://<domain>/api/notes/v1/…
location /api/notes/ {
    proxy_pass http://127.0.0.1:8790/;
    proxy_http_version 1.1;

    # WebSocket /v1/sessions/{id}/live
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # SSE streams (AI, progress) must not be buffered.
    proxy_buffering off;
    proxy_cache off;
    # A lecture socket can stay open for hours.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Materials; bigger files use the presigned upload URL.
    client_max_body_size 52m;
}

# /metrics stays private: only reachable on 127.0.0.1:8790 (or with METRICS_TOKEN).
location = /api/notes/metrics { return 404; }

# Needed once per nginx (http {} block) for the Connection header above:
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
