<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A shared study studio · Octopilot</title>
<meta property="og:title" content="A study studio was shared with you">
<meta property="og:description" content="Open it in the Octopilot app to add your own copy: lessons, flashcards and quizzes.">
<style>
  :root { --bg:#fff; --text:#141210; --muted:#6b6b6b; --accent:#FF2A47; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0b0c; --text:#f4f1f1; --muted:#a39a9c; } }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  main { max-width:420px; padding:32px 20px; text-align:center; }
  h1 { font-size:24px; margin:16px 0 8px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 24px; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:700;
          padding:14px 28px; border-radius:99px; }
  small { display:block; margin-top:18px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div style="font-size:44px" aria-hidden="true">📚</div>
  <h1>A study studio was shared with you</h1>
  <p>Open it in the Octopilot app to add your own copy — lessons, flashcards and quizzes, with your own progress.</p>
  <a class="btn" id="open" href="#">Open in the app</a>
  <small>Don't have the app yet? It's coming to the App Store and Google Play.</small>
</main>
<script>
  var code = location.pathname.split('/').filter(Boolean).pop() || '';
  var a = document.getElementById('open');
  if (/Android/i.test(navigator.userAgent)) {
    a.href = 'intent://studystudio.octopilothub.com/s/' + encodeURIComponent(code) +
             '#Intent;scheme=https;package=com.boardwalklabs.octopilot;end';
  } else {
    a.href = '/s/' + encodeURIComponent(code);
  }
</script>
</body>
</html>
