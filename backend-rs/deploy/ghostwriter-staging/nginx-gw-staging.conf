# gw-staging.octopilothub.com -> ghostwriter-api (staging) on 127.0.0.1:8795.
# certbot --nginx -d gw-staging.octopilothub.com adds the TLS server.
server {
    listen 80;
    listen [::]:80;
    server_name gw-staging.octopilothub.com;

    # A 20 MB attachment, as base64 in JSON.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Run events and live documents are Server-Sent Events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
