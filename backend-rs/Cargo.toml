[workspace]
resolver = "2"
members = ["crates/octo-common", "crates/octopilot-rs", "crates/octonotes-api"]

# Versions shared by every crate, so Doc Oct (octopilot-rs) and OctoNotes
# (octonotes-api) always build against the same auth / DB / HTTP stack.
[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jsonwebtoken = "9"
urlencoding = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
pgvector = { version = "0.4", features = ["sqlx"] }
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
tiny-skia = "0.11"
genpdf = "0.2"
docx-rs = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
octo-common = { path = "crates/octo-common" }

[profile.release]
opt-level = 2
