# =============================================================================
# Cockpit Backend — production overlay.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from the base stack:
#   * cockpit-api runs with `network_mode: host` (same as octopilot-api) so it
#     reaches the EXISTING native `octopilot` Postgres on 127.0.0.1:5432 with
#     ZERO changes to that DB (no pg_hba edit, no restart). uvicorn binds
#     127.0.0.1 only, so the API is NOT public — nginx fronts it for TLS.
#   * Because the API is on the host network (not the docker bridge), it reaches
#     its OWN db/vector/minio via loopback published ports (127.0.0.1:5433/5434/
#     9000), which .env points at. Those ports are loopback-only (not public).
#   * No code bind-mount / hot-reload; the image is the source of truth.
# =============================================================================

services:
  cockpit-api:
    build: .
    network_mode: host
    command: >
      uvicorn app.main:app --host 127.0.0.1 --port 8101 --workers 2
    volumes: !override []
    ports: !override []
    environment:
      APP_ENV: prod
      EMBED_SERVICE_URL: http://127.0.0.1:8091
      SEARCH_SERVICE_URL: http://127.0.0.1:8092
      REDIS_URL: redis://127.0.0.1:6379/0
    restart: always

  cockpit-embed:
    build: .
    network_mode: host
    command: >
      uvicorn app.embed_main:app --host 127.0.0.1 --port 8091 --workers 1
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports: !override []
    environment:
      APP_ENV: prod
      EMBED_SERVICE_URL: ""
      EMBEDDINGS_BACKEND: sentence-transformers
    restart: always

  cockpit-gateway:
    build:
      context: ./go
    network_mode: host
    environment:
      APP_ENV: prod
      GO_ROLE: gateway
      GO_LISTEN: 127.0.0.1:8100
      UPSTREAM_API: http://127.0.0.1:8101
      REDIS_URL: redis://127.0.0.1:6379/0
      OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
    ports: !override []
    restart: always

  cockpit-worker:
    build:
      context: ./go
    network_mode: host
    environment:
      GO_ROLE: worker
      GO_LISTEN: 127.0.0.1:8092
      REDIS_URL: redis://127.0.0.1:6379/0
      EMBED_SERVICE_URL: http://127.0.0.1:8091
      OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      HIRARA_HUB_URL: http://127.0.0.1:8080
    ports: !override []
    restart: always

  cockpit-redis:
    ports: !override ["127.0.0.1:6379:6379"]

  cockpit-db:
    ports: !override ["127.0.0.1:5433:5432"]
  cockpit-vectordb:
    ports: !override ["127.0.0.1:5434:5432"]
  cockpit-minio:
    ports: !override ["127.0.0.1:9000:9000"]
