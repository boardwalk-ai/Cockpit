# =============================================================================
# Cockpit Backend — local/base stack.
#   docker compose up --build
#
# Brings up four containers (as requested): the FastAPI API, a Postgres for
# Cockpit business data, a pgvector Postgres for RAG vectors, and MinIO for
# object storage. Identity + credits are NOT hosted here — they live in the
# existing native `octopilot` Postgres (see README "Database strategy"); wire it
# via SHARED_DATABASE_URL + docker-compose.prod.yml.
# =============================================================================

name: cockpit-backend

services:
  # --- FastAPI ---------------------------------------------------------------
  cockpit-api:
    build: .
    container_name: cockpit-api
    env_file: .env
    environment:
      EMBED_SERVICE_URL: ${EMBED_SERVICE_URL:-http://cockpit-embed:8091}
      SEARCH_SERVICE_URL: ${SEARCH_SERVICE_URL:-http://cockpit-worker:8092}
      REDIS_URL: ${REDIS_URL:-redis://cockpit-redis:6379/0}
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8101}:8100"
    depends_on:
      cockpit-db:
        condition: service_healthy
      cockpit-vectordb:
        condition: service_healthy
      cockpit-minio:
        condition: service_healthy
      cockpit-redis:
        condition: service_healthy
    volumes:
      - ./app:/srv/app:ro
    restart: unless-stopped

  cockpit-embed:
    build: .
    container_name: cockpit-embed
    env_file: .env
    environment:
      EMBED_SERVICE_URL: ""
      EMBEDDINGS_BACKEND: ${EMBEDDINGS_BACKEND:-sentence-transformers}
    command: >
      uvicorn app.embed_main:app --host 0.0.0.0 --port 8091 --workers 1
    volumes:
      - ./app:/srv/app:ro
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  cockpit-redis:
    image: redis:7-alpine
    container_name: cockpit-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cockpit-gateway:
    build:
      context: ./go
    container_name: cockpit-gateway
    env_file: .env
    environment:
      GO_ROLE: gateway
      GO_LISTEN: 0.0.0.0:8100
      UPSTREAM_API: http://cockpit-api:8100
      REDIS_URL: redis://cockpit-redis:6379/0
      OBJECT_STORE_ENDPOINT: http://cockpit-minio:9000
    ports:
      - "${API_BIND:-0.0.0.0}:8100:8100"
    depends_on:
      cockpit-api:
        condition: service_started
      cockpit-redis:
        condition: service_healthy
    restart: unless-stopped

  cockpit-worker:
    build:
      context: ./go
    container_name: cockpit-worker
    env_file: .env
    environment:
      GO_ROLE: worker
      GO_LISTEN: 0.0.0.0:8092
      REDIS_URL: redis://cockpit-redis:6379/0
      EMBED_SERVICE_URL: http://cockpit-embed:8091
      OBJECT_STORE_ENDPOINT: http://cockpit-minio:9000
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      cockpit-redis:
        condition: service_healthy
      cockpit-embed:
        condition: service_started
    restart: unless-stopped

  # --- Cockpit business data (studios, documents, ingest jobs) --------------
  cockpit-db:
    image: postgres:17-alpine
    container_name: cockpit-db
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: cockpit
      POSTGRES_DB: cockpit
    ports:
      # Loopback-only: the API reaches this by service name on the docker network;
      # the host mapping is just for local psql. Never expose a weak-cred DB publicly.
      - "127.0.0.1:5433:5432"       # host 5433 -> avoid clashing with native 5432
    volumes:
      - cockpit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Vector store for RAG (pgvector) --------------------------------------
  cockpit-vectordb:
    image: pgvector/pgvector:pg17
    container_name: cockpit-vectordb
    environment:
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector
      POSTGRES_DB: vector
    ports:
      - "127.0.0.1:5434:5432"       # loopback-only (see cockpit-db)
    volumes:
      - cockpit-vectordb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Object storage for RAG source files (S3-compatible) ------------------
  cockpit-minio:
    image: minio/minio:latest
    container_name: cockpit-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"      # S3 API (loopback-only)
      - "127.0.0.1:9001:9001"      # web console (loopback-only)
    volumes:
      - cockpit-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  cockpit-db-data:
  cockpit-vectordb-data:
  cockpit-minio-data:
  hf-cache:
