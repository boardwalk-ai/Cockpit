name: ghostwriter
description: "GhostWriter — the AI essay-writing module for the Octopilot super-app."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  http: ^1.5.0
  cockpit_ui:
    path: ../cockpit_ui
  cockpit_module:
    path: ../cockpit_module

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/ghost.png

  # Plus Jakarta Sans (the primary face) comes from cockpit_ui.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
