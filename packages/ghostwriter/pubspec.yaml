name: ghostwriter
description: "GhostWriter — the AI essay-writing module for the Octopilot super-app."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  http: ^1.5.0
  cockpit_ui:
    path: ../cockpit_ui
  cockpit_module:
    path: ../cockpit_module
  # The editor shares Doc Oct's foundation: quill, the field model, the fonts.
  doc_oct:
    path: ../doc_oct
  flutter_quill: ^11.5.1
  # Attaching files (the system picker shows Drive, OneDrive, …) and photos.
  file_picker: ^8.1.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/ghost.png
    - assets/images/octo.png

  # Plus Jakarta Sans and Poppins come from cockpit_ui.
