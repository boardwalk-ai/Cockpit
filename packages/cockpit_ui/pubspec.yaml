name: cockpit_ui
description: "Design system = global controls (color/typography/spacing tokens, theme, shared components)."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The OctoCredits coin, shared by every module's credits pill.
  assets:
    - assets/images/octocredits.png
    - assets/images/octocredits_large.png
  # Plus Jakarta Sans — the shared borderless design-system font (OFL).
  # Available to every package that depends on cockpit_ui as family
  # `packages/cockpit_ui/PlusJakartaSans`.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    # Poppins — the body face of the phone modules (GhostWriter, Study
    # Studio), family `packages/cockpit_ui/Poppins` (OFL).
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    # Literata — the reading face for long lesson text (variable: wght,
    # opsz), family `packages/cockpit_ui/Literata` (OFL).
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
    # Caveat — handwriting (OctoNotes' Magic Pencil text), variable wght,
    # family `packages/cockpit_ui/Caveat` (OFL).
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
