name: octo_notes
description: "OctoNotes — the lecture-capture & AI notes module for the Octopilot super-app."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.1
  cockpit_core:
    path: ../cockpit_core
  cockpit_ui:
    path: ../cockpit_ui
  cockpit_module:
    path: ../cockpit_module
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  record: ^7.1.2
  image_picker: ^1.2.4
  flutter_foreground_task: ^11.0.3
  http_parser: ^4.1.2
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  sherpa_onnx: ^1.13.8
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The design-system font (Plus Jakarta Sans) is bundled once in cockpit_ui and
  # used app-wide as `packages/cockpit_ui/PlusJakartaSans` — nothing to declare here.
