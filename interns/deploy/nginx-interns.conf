# Interns assignment board — static site at interns.octopilothub.com
#
# Install on the server (187.124.92.119):
#   sudo cp interns/deploy/nginx-interns.conf /etc/nginx/sites-available/interns
#   sudo ln -sf /etc/nginx/sites-available/interns /etc/nginx/sites-enabled/interns
#   sudo nginx -t && sudo systemctl reload nginx
#   # then TLS (adds the 443 block + http->https redirect automatically):
#   sudo certbot --nginx -d interns.octopilothub.com
#
# Files are served from /var/www/interns (published by deploy/deploy.sh).
# DNS: interns.octopilothub.com  A  187.124.92.119

server {
    listen 80;
    listen [::]:80;
    server_name interns.octopilothub.com;

    root /var/www/interns;
    index index.html;

    # The page is task-detail only; keep it out of search indexes.
    add_header X-Robots-Tag "noindex" always;

    # HTML: no-cache so task edits go live on the next reload.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Images/fonts: cache a while (they rarely change).
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
