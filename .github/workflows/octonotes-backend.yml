name: octonotes backend

on:
  push:
    paths: ["backend-rs/**", "packages/octo_notes/**", ".github/workflows/octonotes-backend.yml"]
  pull_request:
    paths: ["backend-rs/**", "packages/octo_notes/**", ".github/workflows/octonotes-backend.yml"]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rs
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: octonotes
          POSTGRES_PASSWORD: octonotes
          POSTGRES_DB: octonotes
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U octonotes" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    env:
      TEST_PG_URL: postgres://octonotes:octonotes@127.0.0.1:5435
      TEST_REDIS_URL: redis://127.0.0.1:6380
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs
      - name: ffmpeg + poppler (audio join, PDF renders)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg poppler-utils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
        working-directory: packages/octo_notes
      - run: flutter test
        working-directory: packages/octo_notes
