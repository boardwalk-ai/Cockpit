# Included in the octopilothub.com server: the internal app downloads.
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /app/\n";
}
location = /app/releases { return 301 /app/releases/; }
location ^~ /app/releases/ {
    alias /var/www/octopilot-releases/;
    index index.html;
    if ($octo_bot) { return 403; }
    limit_req zone=octo_releases burst=40 nodelay;
    limit_req_status 429;
    types {
        text/html html;
        application/json json;
        image/jpeg jpg;
        application/vnd.android.package-archive apk;
    }
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition $octo_disposition always;
    add_header Cache-Control "no-cache" always;
}
