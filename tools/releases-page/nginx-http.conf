# http-level pieces for octopilothub.com/app/releases (conf.d/octo-releases.conf).
# Known crawlers, link-preview fetchers, AI scrapers and plain HTTP tools get
# a 403 there. (A bot that lies about itself still gets through — the APIs
# behind the app are what keep strangers out: the test allowlist.)
map $http_user_agent $octo_bot {
    default 0;
    "" 1;
    ~*(bot|crawl|spider|slurp|scrapy|curl|wget|python|httpx|aiohttp|go-http|java/|okhttp|libwww|headless|phantom|puppeteer|playwright|selenium) 1;
    # Link-preview fetchers (most others say "bot"). Not "telegram" etc.: their
    # in-app browsers are real people opening the link.
    ~*(facebookexternalhit|embedly|iframely|preview|whatsapp/) 1;
    ~*(google|bing|yandex|baidu|duckduck|semrush|ahrefs|mj12|dotbot|petal|seznam|sogou|exabot|ia_archiver|archive\.org) 1;
    # AI crawlers and fetchers by name (not "Claude/" — the Claude app's browser).
    ~*(gptbot|chatgpt-user|oai-searchbot|claudebot|claude-web|claude-user|anthropic-ai|perplexity|ccbot|bytespider|cohere-ai|diffbot|omgili|meta-external|google-extended) 1;
}
map $uri $octo_disposition {
    default "";
    ~\.apk$ "attachment";
}
limit_req_zone $binary_remote_addr zone=octo_releases:10m rate=30r/m;
